[package]
name = "maestro-fabric-gui"
version = "0.1.0"
description = "Desktop control surface for Maestro Gateway and Fabric"
edition = "2021"
publish = false

[workspace]

[lib]
name = "maestro_fabric_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3.6.1"
tempfile = "3"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
